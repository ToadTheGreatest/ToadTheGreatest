<!DOCTYPE html>
<html>

<head>
    <title>ToadTheGreatest's Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #444;
            color: #fff;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 48px);
        }

        .background {
            background-color: #222;
            border-radius: 30px;
            width: 80vw;
            height: 80vh;
            padding: 20px;
        }

        h1 {
            padding: 10px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: transparent;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #fff;
            text-decoration: none;
        }

        .nav-links a.active {
            text-decoration: underline;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            z-index: 1001;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 260px;
                background: #333;
                flex-direction: column;
                padding: 4.5rem 2rem 2rem;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }

            .nav-links.open {
                transform: translateX(0);
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                width: 100%;
            }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
        <ul class="nav-links">
            <li><a href="../">Home</a></li>
            <li><a href="../socials/">Socials</a></li>
            <li><a href="../happenings/">Happenings</a></li>
            <li><a class="active" href="./">Songs</a></li>
            <!--<li><a href="">Games</a></li>-->
        </ul>
    </nav>
    <canvas id="canvas"></canvas>
    <div class="container">
        <div class="background">
            <!-- Main Content -->
            <h1>Welcome to ToadTheGreatest's Website!</h1>
            <h3>THIS PAGE OF MY SITE IS DEDICATED TO ONE OF MY FREINDS WHO REALLY LIKES UNICORNS</h3>
        </div>
    </div>
    <script>
        const queryString = window.location.search;

        const urlParams = new URLSearchParams(queryString);

        if (urlParams.get('secret') === "VSauce") {
            document.getElementById("text").innerHTML = "Hello there, I am toadthegreatest. or am i???????????????????????"
        }

        const toggleButton = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        toggleButton.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            toggleButton.setAttribute('aria-expanded', isOpen);
            toggleButton.textContent = isOpen ? '✕' : '☰'; // Switches icon to X when open
        });

        // RAINBOW SPARKLY

        var SIZE = 5; // size (pixels) of each square
        var SPEED = 250 // time (milliseconds) between redraws

        var rnbw_sprkly = document.getElementById("canvas");
        var ctx = rnbw_sprkly.getContext("2d");
        var colors = [
            "#ff0000", // red
            "#ffaa00", // orange
            "#ffff00", // yellow
            "#00ff00", // green
            "#00ffff", // light blue
            "#0000ff", // blue
            "#aa00ff", // porple
            "#ff00aa", // pink
        ]

        function getRandomMax(mx) {
            return Math.round(Math.random() * mx);
        }

        function resize() {
            rnbw_sprkly.width = window.innerWidth;
            rnbw_sprkly.height = window.innerHeight;
        }

        function drawRainbowSparkly() {
            ctx.clearRect(0, 0, rnbw_sprkly.width, rnbw_sprkly.height);
            for (x = 0; x < 25; x++) {
                ctx.fillStyle = colors[getRandomMax(colors.length - 1)];
                ctx.fillRect(getRandomMax(rnbw_sprkly.width), getRandomMax(rnbw_sprkly.height), SIZE, SIZE);
            }
            setTimeout(drawRainbowSparkly, SPEED);
        }

        // init rainbow sparkly
        resize();
        window.requestAnimationFrame(drawRainbowSparkly);

        window.addEventListener("resize", resize);
    </script>
</body>

</html>
