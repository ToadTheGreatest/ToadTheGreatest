<!DOCTYPE html>
<html>

<head>
    <title>HACK A BANK ACCONT (NOT REALLY)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            overflow: hidden;
            color: #fff;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 48px);
        }

        .background {
            background-color: transparent;
            border-radius: 30px;
            width: 80vw;
            height: 80vh;
            padding: 20px;
        }

        h1 {
            padding: 10px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: transparent;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #fff;
            text-decoration: none;
        }

        .nav-links a.active {
            text-decoration: underline;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            z-index: 1001;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 260px;
                background: #333;
                flex-direction: column;
                padding: 4.5rem 2rem 2rem;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }

            .nav-links.open {
                transform: translateX(0);
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                width: 100%;
            }
        }

        canvas {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }
        h1 h3 {
            color: #fff;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
        <ul class="nav-links">
            <li><a href="../">Home</a></li>
            <li><a href="../socials/">Socials</a></li>
            <li><a href="../happenings/">Happenings</a></li>
            <li><a href="../songs/">Songs</a></li>
            <li><a class="active" href="./">Hack a Bank Account (hidden)</a></li>
            <!--<li><a href="">Games</a></li>-->
        </ul>
    </nav>
    <canvas id="canvas"></canvas>
    <div class="container">
        <div class="background">
            <!-- Main Content -->
            <h1>Welcome to ToadTheGreatest's Website!</h1>
            <h3>THIS PAGE OF MY SITE IS DEDICATED TO ONE OF MY FREINDS WHO WANTS ME TO HACK A BANK ACCOUNT EVEN THOUGH I
                WONT CUZ I DONT WANNA COMMIT A CRIME</h3>
        </div>
    </div>
    <script>
        const toggleButton = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        toggleButton.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            toggleButton.setAttribute('aria-expanded', isOpen);
            toggleButton.textContent = isOpen ? '✕' : '☰'; // Switches icon to X when open
        });

        // MATRIX RAIN EFFECT
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const chars = document.documentElement.innerHTML.replace(/\s+/g, '').split("");
        const fontSize = 16;
        let columns = 0;
        let drops = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            drops = Array(columns).fill(1);
        }

        function drawMatrix() {
            ctx.fillStyle = "rgba(17, 17, 17, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ff00";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const randomChar = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(randomChar, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        resize();
        window.addEventListener("resize", resize);
        setInterval(drawMatrix, 40);
    </script>
</body>

</html>
