<!DOCTYPE html>
<html>

<head>
    <title>ToadTheGreatest's Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #444;
            color: #fff;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 48px);
        }

        .background {
            background-color: #222;
            border-radius: 30px;
            width: 80vw;
            height: 80vh;
            padding: 20px;
        }

        h1 {
            padding: 10px;
        }

        .navbar {
            background-color: transparent;
            overflow: hidden;
        }

        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar a {
            display: block;
            color: rgb(187, 187, 187);
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }

        .navbar a:hover {
            color: white;
            background-color: transparent;
        }

        .navbar a.active {
            background-color: transparent;
            text-decoration: underline;
        }
        .version {
            position: absolute;
            left: 10px;
            bottom: 10px;
            color: #888;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <ul>
            <li><a class="active" href="./">Home</a></li>
            <li><a href="./socials">Socials</a></li>
            <li><a href="./happenings/">Happenings</a></li>
            <!--<li><a href="">Games</a></li>-->
        </ul>
    </nav>
    <div class="container">
        <div class="background">
            <!-- Main Content -->
            <h1>Welcome to ToadTheGreatest's Website!</h1>
            <span id="text">
                Hello people (you are not axolotls, i am). This is my website.
            </span>
            <span class="version">v1.0</span>
        </div>
    </div>
    <script>
        const queryString = window.location.search;

        const urlParams = new URLSearchParams(queryString);

        if (urlParams.get('secret') === "VSauce") {
            document.getElementById("text").innerHTML = "Hello there, I am toadthegreatest. or am i???????????????????????"
        }
    </script>
</body>

</html>
