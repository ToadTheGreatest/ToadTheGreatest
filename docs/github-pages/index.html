<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToadTheGreatest's Websites</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #444;
            color: #fff;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 48px);
        }

        .background {
            background-color: #222;
            border-radius: 30px;
            width: 80vw;
            height: 80vh;
            padding: 20px;
        }

        h1 {
            padding: 10px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: transparent;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #fff;
            text-decoration: none;
        }

        .nav-links a.active {
            text-decoration: underline;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            z-index: 1001;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 260px;
                background: #333;
                flex-direction: column;
                padding: 4.5rem 2rem 2rem;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }

            .nav-links.open {
                transform: translateX(0);
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                width: 100%;
            }
        }

        .websites button {
            border-radius: 10px;
            border-style: solid;
            width: 100px;
            height: 40px;
            color: #fff;
            background-color: #666;
            border-color: #666;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .websites button:hover {
            background-color: #555;
            border-color: #555;
        }
        .websites button:active {
            background-color: #000;
            border-color: #000;
        }
        .websites {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 5px; 
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
        <ul class="nav-links">
            <li><a href="../">Home</a></li>
            <li><a href="../socials/">Socials</a></li>
            <li><a href="../happenings">Happenings</a></li>
            <li><a href="../songs/">Songs</a></li>
            <li><a class="active" href="./">Websites</a></li>
            <!--<li><a href="../">Games</a></li>-->
        </ul>
    </nav>
    <div class="container">
        <div class="background">
            <!-- Main Content -->
            <h1>Welcome to ToadTheGreatest's Website!</h1>
            <div class="websites">
                <button onclick="gotogithubpage('Square-Root-Simplifier')">Square Root Simplifier</button>
                <button onclick="gotogithubpage('loogle-stuff')">Loogle Stuff</button>
                <button onclick="gotogithubpage('file-to-data-uri-converter')">File to URI Converter</button>
                <button onclick="gotogithubpage('Smartest-Website')">Smartest (dumbest) Website</button>
                <button onclick="gotogithubpage('ollama-local-ai-website')">Local AI Website</button>
                <button onclick="gotogithubpage('item-name-generator')">Item Name Generator</button>
                <button onclick="gotogithubpage('memorize-it-up')">Memorize It Up</button>
                <button onclick="gotogithubpage('Google-AI-Remover')">Google AI Remover</button>
                <button onclick="gotogithubpage('HTML-Games')">HTML Games</button>
            </div>
        </div>
    </div>
    <script>
        const toggleButton = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        toggleButton.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            toggleButton.setAttribute('aria-expanded', isOpen);
            toggleButton.textContent = isOpen ? '✕' : '☰'; // Switches icon to X when open
        });

        function gotogithubpage(repo) {
            open(`https://toadthegreatest.github.io/${repo}`);
        }
    </script>
</body>

</html>
